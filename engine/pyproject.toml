[project]
name = "minutes-engine"
version = "0.1.0"
description = "Local MLX engine for Minutes: Parakeet ASR, speaker alignment, Qwen meeting notes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "parakeet-mlx>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
minutes-engine = "minutes_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minutes_engine"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
