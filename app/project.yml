name: Minutes
options:
  bundleIdPrefix: dev.minutes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.17.4

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Minutes:
    type: application
    platform: macOS
    sources:
      - path: Sources/Minutes
      - path: ../profiles
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
    info:
      path: Sources/Minutes/Info.plist
      properties:
        CFBundleDisplayName: Minutes
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: Minutes records your microphone to transcribe meetings locally on this Mac.
        NSAudioCaptureUsageDescription: Minutes records call audio to transcribe meetings locally on this Mac.
        NSScreenCaptureUsageDescription: Minutes captures system audio from meeting apps. No video is recorded.
        MinutesEngineDevPath: $(SRCROOT)/../engine
        MinutesProfilesDevPath: $(SRCROOT)/../profiles
    entitlements:
      path: Sources/Minutes/Minutes.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.minutes.app
        PRODUCT_NAME: Minutes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  minutes-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Minutes
        excludes:
          - "Views/**"
          - "Assets.xcassets"
          - "MinutesApp.swift"
          - "Info.plist"
          - "Minutes.entitlements"
      - path: Sources/MinutesCLI
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: minutes-cli
        PRODUCT_BUNDLE_IDENTIFIER: dev.minutes.cli
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MINUTES_CLI"

schemes:
  Minutes:
    build:
      targets:
        Minutes: all
    run:
      config: Debug
  minutes-cli:
    build:
      targets:
        minutes-cli: all
    run:
      config: Debug
